<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emoncms Energy Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --error: #f87171;
      --border: #334155;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    input[type="password"], input[type="text"] {
      flex: 1;
      padding: 0.75rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
    }

    button {
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }

    .status.error { color: var(--error); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    .metric {
      background: var(--bg);
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .metric-id { font-size: 0.75rem; color: var(--muted); }
    .metric-val { font-size: 1.5rem; font-weight: 700; color: var(--accent); margin-top: 0.25rem; }
  </style>
</head>
<body>

<div class="container">
  <h2>Energy Dashboard</h2>

  <div class="card">
    <div class="form-group">
      <input type="password" id="apiKeyInput" placeholder="Enter Emoncms Read API Key" />
      <button id="saveBtn" onclick="saveApiKey()">Sync Dashboard</button>
    </div>
    <div id="statusMsg" class="status">Idle</div>
  </div>

  <div class="card">
    <h3>Live Feed Readings</h3>
    <div id="readingsGrid" class="grid">
      <div class="status">No data fetched yet.</div>
    </div>
  </div>
</div>

<script>
  // All 10 Target Feed IDs
  const FEED_IDS = [537676, 537677, 537680, 537681, 537674, 537675, 536155, 536147, 539991, 539990];

  document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem('emoncms_apikey');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      updateData();
    }
  });

  function saveApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) return setStatus('Please enter a valid API key.', true);
    localStorage.setItem('emoncms_apikey', key);
    updateData();
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = `status ${isError ? 'error' : ''}`;
  }

  // Fetch helper with explicit timeout using AbortController
  async function fetchWithTimeout(url, options = {}, timeoutMs = 8000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);

    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      clearTimeout(id);
      return response;
    } catch (err) {
      clearTimeout(id);
      throw err;
    }
  }

  // Fetch with exponential backoff retry for network/timeout errors
  async function fetchWithRetry(url, retries = 3, delay = 1000) {
    for (let i = 0; i < retries; i++) {
      try {
        const res = await fetchWithTimeout(url);
        if (res.status === 408) throw new Error('HTTP 408 Timeout');
        if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
        return await res.json();
      } catch (err) {
        if (i === retries - 1) throw err;
        await new Promise(r => setTimeout(r, delay * Math.pow(2, i)));
      }
    }
  }

  // Batch requests into smaller chunks (5 feeds max per call)
  async function fetchEmoncmsData(apiKey) {
    const chunkSize = 5;
    const chunks = [];
    
    for (let i = 0; i < FEED_IDS.length; i += chunkSize) {
      chunks.push(FEED_IDS.slice(i, i + chunkSize));
    }

    const fetchPromises = chunks.map(chunk => {
      const url = `https://emoncms.org/feed/fetch.json?ids=${chunk.join(',')}&apikey=${apiKey}`;
      return fetchWithRetry(url);
    });

    const results = await Promise.all(fetchPromises);
    
    // Combine chunked JSON responses into a single object map
    return Object.assign({}, ...results);
  }

  async function updateData() {
    const apiKey = localStorage.getItem('emoncms_apikey');
    if (!apiKey) return setStatus('Missing API Key', true);

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    setStatus('Fetching data from Emoncms...');

    try {
      const data = await fetchEmoncmsData(apiKey);
      renderReadings(data);
      setStatus(`Last updated: ${new Date().toLocaleTimeString()}`);
    } catch (err) {
      console.error('Dashboard sync error:', err);
      setStatus(`Dashboard sync error: ${err.message}`, true);
    } finally {
      btn.disabled = false;
    }
  }

  function renderReadings(data) {
    const grid = document.getElementById('readingsGrid');
    grid.innerHTML = '';

    FEED_IDS.forEach(id => {
      const val = data[id] !== undefined ? data[id] : 'N/A';
      const card = document.createElement('div');
      card.className = 'metric';
      card.innerHTML = `
        <div class="metric-id">Feed ID: ${id}</div>
        <div class="metric-val">${typeof val === 'number' ? val.toFixed(1) : val}</div>
      `;
      grid.appendChild(card);
    });
  }
</script>

</body>
</html>
